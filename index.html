<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Great Escape</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; font-family: 'Courier New', monospace; color: #fff; overflow: hidden; }
  #gameContainer { position: relative; }
  #gameCanvas { display: block; border: 2px solid #fff; image-rendering: pixelated; }
  #ui { position: absolute; top: 0; left: 0; width: 100%; pointer-events: none; }
  #hud { display: flex; justify-content: space-between; padding: 4px 8px; background: rgba(0,0,0,0.8); font-size: 12px; color: #fff; border-bottom: 1px solid #555; }
  .stat-bar { display: flex; align-items: center; gap: 4px; }
  .bar-bg { width: 80px; height: 10px; background: #333; border: 1px solid #555; }
  .bar-fill { height: 100%; transition: width 0.2s; }
  #suspicionBar { background: #f00; }
  #energyBar { background: #0f0; }
  #healthBar { background: #ff0; }
  #messages { position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%); text-align: center; pointer-events: none; }
  .message { background: rgba(0,0,0,0.85); border: 1px solid #ff0; padding: 6px 14px; font-size: 13px; color: #ff0; margin: 4px 0; animation: fadeIn 0.3s; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  #overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(0,0,0,0.9); z-index: 10; }
  #overlay h1 { font-size: 36px; color: #ff0; text-shadow: 2px 2px #f00; margin-bottom: 10px; letter-spacing: 4px; }
  #overlay h2 { font-size: 20px; color: #0ff; margin-bottom: 20px; }
  #overlay p { color: #aaa; font-size: 12px; margin: 3px 0; max-width: 400px; text-align: center; }
  #overlay button { margin-top: 20px; padding: 10px 30px; background: #00a; border: 2px solid #0ff; color: #0ff; font-family: inherit; font-size: 16px; cursor: pointer; letter-spacing: 2px; }
  #overlay button:hover { background: #00f; }
  #clock { font-size: 14px; color: #0ff; }
  #itemList { position: absolute; right: 4px; top: 30px; font-size: 11px; color: #ff0; }
  #scheduleInfo { position: absolute; left: 4px; top: 30px; font-size: 11px; color: #aaa; }
  #minimap { position: absolute; bottom: 4px; right: 4px; border: 1px solid #555; }
</style>
</head>
<body>
<div id="gameContainer">
  <canvas id="gameCanvas"></canvas>
  <div id="ui">
    <div id="hud">
      <div class="stat-bar">SUSPICION: <div class="bar-bg"><div class="bar-fill" id="suspicionBar" style="width:0%"></div></div></div>
      <div id="clock">06:00</div>
      <div class="stat-bar">ENERGY: <div class="bar-bg"><div class="bar-fill" id="energyBar" style="width:100%"></div></div></div>
    </div>
    <div id="scheduleInfo"></div>
    <div id="itemList"></div>
    <div id="messages"></div>
    <canvas id="minimap" width="80" height="80"></canvas>
  </div>
  <div id="overlay">
    <h1>THE GREAT ESCAPE</h1>
    <h2>ZX Spectrum 1986</h2>
    <p>You are a British POW in a German camp. Find items and escape!</p>
    <p>&nbsp;</p>
    <p>WASD / Arrow Keys: Move &nbsp;|&nbsp; E: Pick up item</p>
    <p>Avoid guards — high suspicion = game over</p>
    <p>Complete roll calls • Maintain cover • Find escape route</p>
    <button id="startBtn">PRESS TO START</button>
  </div>
</div>
<script src="game.js"></script>
</body>
</html>
